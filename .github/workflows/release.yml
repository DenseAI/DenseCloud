name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to publish or retry
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Go test
        run: go test ./...

      - name: Go race test
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Verify tag, chart, and release notes
        run: |
          git fetch --force --tags
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "refs/tags/${RELEASE_TAG}^{commit}")"
          test "${RELEASE_TAG#v}" != "${RELEASE_TAG}"
          release_version="${RELEASE_TAG#v}"
          chart_version="$(helm show chart charts/dense-base | awk '/^version:/ { print $2 }')"
          test "${release_version}" = "${chart_version}"
          test -f "docs/releases/${RELEASE_TAG}.md"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8

      - name: Lint workflow YAML
        run: '"$(go env GOPATH)/bin/actionlint" -color'

      - name: Verify tagged Go module resolves publicly
        run: |
          module_dir="$(mktemp -d)"
          cd "${module_dir}"
          go mod init densecloud-release-consumer
          # A tag-triggered job can outrun checksum-database indexing.
          GOPROXY=direct GONOSUMDB=github.com/DenseAI/DenseCloud \
            go get "github.com/DenseAI/DenseCloud@${RELEASE_TAG}"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  ./kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Helm render matrix
        run: bash scripts/helm_matrix.sh

      - name: Docker runtime smoke
        run: bash scripts/docker_smoke.sh

      - name: Kind runtime smoke
        run: bash scripts/kind_smoke.sh

  github-release:
    runs-on: ubuntu-latest
    needs: [verify, verify-published-chart]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Package Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Build chart package
        run: bash scripts/package_helm.sh /tmp/charts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: true
          files: /tmp/charts/*.tgz

  publish-chart:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: bash scripts/package_helm.sh /tmp/charts

      - name: Configure OCI namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "OCI_NAMESPACE=${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Push chart to OCI registry
        run: helm push /tmp/charts/dense-base-*.tgz "oci://ghcr.io/${OCI_NAMESPACE}/charts"

  verify-published-chart:
    runs-on: ubuntu-latest
    needs: publish-chart
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    steps:
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Verify anonymous chart pull
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          release_version="${RELEASE_TAG#v}"
          oci_namespace="${REPOSITORY_OWNER,,}"
          helm show chart "oci://ghcr.io/${oci_namespace}/charts/dense-base" \
            --version "${release_version}"
