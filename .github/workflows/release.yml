name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint charts/dense-base

      - name: Build renderer dependencies
        run: helm dependency build charts/dense-base/examples/renderer

      - name: Render chart smoke test
        run: |
          helm template dense-base-smoke charts/dense-base/examples/renderer \
            -f charts/dense-base/examples/renderer/values/minimal.yaml \
            > /tmp/dense-base.rendered.yaml

  github-release:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Build chart package
        run: helm package charts/dense-base --destination /tmp/charts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: /tmp/charts/*.tgz

  publish-chart:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/dense-base --destination /tmp/charts

      - name: Push chart to OCI registry
        run: helm push /tmp/charts/dense-base-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
