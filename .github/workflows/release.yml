name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Go test
        run: go test ./...

      - name: Go race test
        run: go test -race ./go/server

      - name: Go vet
        run: go vet ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Verify tag, chart, and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          chart_version="$(helm show chart charts/dense-base | awk '/^version:/ { print $2 }')"
          test "${release_version}" = "${chart_version}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Verify tagged Go module resolves publicly
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          module_dir="$(mktemp -d)"
          cd "${module_dir}"
          go mod init densecloud-release-consumer
          GOPROXY=direct go get "github.com/DenseAI/DenseCloud@${GITHUB_REF_NAME}"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  ./kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Helm render matrix
        run: bash scripts/helm_matrix.sh

      - name: Docker runtime smoke
        run: bash scripts/docker_smoke.sh

      - name: Kind runtime smoke
        run: bash scripts/kind_smoke.sh

  github-release:
    runs-on: ubuntu-latest
    needs: [verify, verify-published-chart]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Build chart package
        run: bash scripts/package_helm.sh /tmp/charts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: /tmp/charts/*.tgz

  publish-chart:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: bash scripts/package_helm.sh /tmp/charts

      - name: Configure OCI namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "OCI_NAMESPACE=${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Push chart to OCI registry
        run: helm push /tmp/charts/dense-base-*.tgz "oci://ghcr.io/${OCI_NAMESPACE}/charts"

  verify-published-chart:
    runs-on: ubuntu-latest
    needs: publish-chart
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Verify anonymous chart pull
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          oci_namespace="${REPOSITORY_OWNER,,}"
          helm show chart "oci://ghcr.io/${oci_namespace}/charts/dense-base" \
            --version "${release_version}"
