name: helm-ci

on:
  push:
    paths:
      - "charts/dense-base/**"
      - ".github/workflows/helm-ci.yml"
  pull_request:
    paths:
      - "charts/dense-base/**"
      - ".github/workflows/helm-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint charts/dense-base

      - name: Helm package
        run: helm package charts/dense-base --destination /tmp/charts

  render-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        values_file:
          - minimal.yaml
          - ingress-cert-manager.yaml
          - grpc-cert-manager.yaml
          - networkpolicy-ingress-nginx.yaml
          - networkpolicy-monitoring.yaml
          - networkpolicy-otel-collector.yaml
          - networkpolicy-strict.yaml
          - keda-custom-trigger.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Build renderer dependencies
        run: helm dependency build charts/dense-base/examples/renderer

      - name: Render example matrix
        run: >
          helm template dense-base-smoke charts/dense-base/examples/renderer
          -f charts/dense-base/examples/renderer/values/${{ matrix.values_file }}
          > /tmp/${{ matrix.values_file }}.rendered.yaml

  render-validation:
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Run full render validation script
        run: bash scripts/helm_matrix.sh

  kind-smoke:
    runs-on: ubuntu-latest
    needs:
      - lint
      - render-matrix
      - render-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run kind smoke apply
        run: bash scripts/kind_smoke.sh
