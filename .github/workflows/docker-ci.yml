name: docker-ci

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "scripts/docker_smoke.sh"
      - ".github/workflows/docker-ci.yml"

  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "scripts/docker_smoke.sh"
      - ".github/workflows/docker-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docker runtime smoke
        run: bash scripts/docker_smoke.sh
