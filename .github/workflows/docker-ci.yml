name: docker-ci

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "scripts/docker_smoke.sh"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "scripts/docker_smoke.sh"
      - ".github/workflows/docker-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker runtime smoke
        run: bash scripts/docker_smoke.sh
