dense-base:
  image:
    repository: registry.example.invalid/dense/workload
    tag: latest
  ingress:
    enabled: true
    className: nginx
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-prod
    hosts:
      - host: api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: example-http-tls
        hosts:
          - api.example.com
